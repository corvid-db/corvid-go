# ci — the Go-consumer gate.
#
# Per platform × Go line: fetch + sha256-verify the pinned engine
# release artifacts, then go vet + go test ./... — the golden-suite port
# (256 executable lines across 8 fixtures) replayed through the binding
# against the DOWNLOADED cdylib. A Linux leg additionally runs
# golangci-lint. Every leg is required-green; the whole job set stays
# under ~5 minutes (fetch is seconds, the suite is sub-second).
#
# Toolchain policy (scripts/bindings/README.md, engine repo): modern
# minimums, CI tests latest + previous — the go.mod floor is latest-1
# and the matrix pins 1.27.x (latest) + 1.26.x (floor).

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / go${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27.x', '1.26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os != 'Windows'
        run: ./fetch.sh

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fetch.ps1

      # Windows has no rpath: the cdylib must be on the DLL search
      # path for the test binary to load it.
      - name: Put corvid.dll on the DLL search path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$(Get-Location)\deps\current"

      - name: go vet
        run: go vet ./...

      - name: Golden suite (256 fixture lines through the binding)
        run: go test -v ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Fetch + verify engine artifacts (sha256)
        run: ./fetch.sh

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
