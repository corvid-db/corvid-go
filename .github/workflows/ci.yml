# ci — the Go-consumer gate.
#
# Per platform: fetch + sha256-verify the pinned engine release
# artifacts, then go vet + go test ./... — the golden-suite port (256
# executable lines across 8 fixtures) replayed through the binding
# against the DOWNLOADED cdylib. A Linux leg additionally runs
# golangci-lint. Every leg is required-green; the whole job set stays
# under ~5 minutes (fetch is seconds, the suite is sub-second).

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os != 'Windows'
        run: ./fetch.sh

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fetch.ps1

      # Windows has no rpath: the cdylib must be on the DLL search
      # path for the test binary to load it.
      - name: Put corvid.dll on the DLL search path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$(Get-Location)\deps\current"

      - name: go vet
        run: go vet ./...

      - name: Golden suite (256 fixture lines through the binding)
        run: go test -v ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch + verify engine artifacts (sha256)
        run: ./fetch.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
